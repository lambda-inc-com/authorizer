syntax = "proto3";

package ai_service;

option go_package = "./proto";

// 流式聊天请求
message StreamChatRequest {
  string model_name = 1;              // 模型名称
  string user_id = 2;                 // 用户ID
  repeated StreamChatMessage messages = 3;   // 消息历史
  map<string, string> parameters = 4;  // 参数
}

// 流式聊天响应
message StreamChatResponse {
  string content = 1;                  // 内容片段
  bool is_complete = 2;                // 是否完成
  string model_used = 3;               // 使用的模型
  int32 tokens_used = 4;               // 使用的token数
  int32 points_consumed = 5;           // 消耗的积分
  string finish_reason = 6;            // 完成原因
  string error = 7;                    // 错误信息（如果有）
}

// 流式工作流执行请求
message StreamWorkflowRequest {
  string workflow_name = 1;            // 工作流名称
  string user_id = 2;                  // 用户ID
  map<string, string> inputs = 3;      // 输入参数
  map<string, string> config = 4;      // 配置参数
}

// 流式工作流执行响应
message StreamWorkflowResponse {
  string workflow_id = 1;              // 工作流执行ID
  string status = 2;                   // 当前状态
  string current_step = 3;             // 当前执行步骤
  string step_output = 4;              // 步骤输出
  float progress = 5;                  // 进度百分比
  bool is_complete = 6;                // 是否完成
  map<string, string> final_outputs = 7; // 最终输出
  string error = 8;                    // 错误信息
}

// 流式聊天消息
message StreamChatMessage {
  string role = 1;                     // 角色：user/assistant/system
  string content = 2;                  // 内容
}

// AI服务接口 - 流式版本
service AIStreamService {
  // 流式聊天接口
  rpc StreamChat(StreamChatRequest) returns (stream StreamChatResponse);
  
  // 流式工作流执行
  rpc StreamWorkflowExecute(StreamWorkflowRequest) returns (stream StreamWorkflowResponse);
  
  // 流式工作流生成
  rpc StreamWorkflowGenerate(StreamWorkflowRequest) returns (stream StreamWorkflowResponse);
} 